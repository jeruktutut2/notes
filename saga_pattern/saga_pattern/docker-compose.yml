services:
  db:
    image: postgres:16-alpine
    container_name: saga_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saga_db
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saga_db"]
      interval: 3s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: saga_pgbouncer
    environment:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: saga_db
      DB_HOST: db
      DB_PORT: 5432
      LISTEN_PORT: 6432
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 25
      AUTH_TYPE: trust
      AUTH_FILE: /etc/pgbouncer/userlist.txt
    ports:
      - "6432:6432"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt
    depends_on:
      db:
        condition: service_healthy

  kafka:
    image: apache/kafka:latest
    container_name: saga_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: saga_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka-saga-svc:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: kafka_saga
    container_name: saga_kafka_svc
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      DB_HOST: pgbouncer
      DB_PORT: "6432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: saga_db
      KAFKA_BROKER: kafka:9092
    depends_on:
      pgbouncer:
        condition: service_started
      kafka:
        condition: service_started

  rabbitmq-saga-svc:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: rabbitmq_saga
    container_name: saga_rabbitmq_svc
    ports:
      - "8082:8082"
    environment:
      PORT: "8082"
      DB_HOST: pgbouncer
      DB_PORT: "6432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: saga_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      pgbouncer:
        condition: service_started
      rabbitmq:
        condition: service_healthy
