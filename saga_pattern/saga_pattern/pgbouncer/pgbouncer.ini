[databases]
saga_db = host=db port=5432 dbname=saga_db user=postgres password=postgres

[pgbouncer]
listen_addr = *
listen_port = 6432
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres
pool_mode = transaction
max_client_conn = 200
default_pool_size = 25
reserve_pool_size = 5
ignore_startup_parameters = extra_float_digits
