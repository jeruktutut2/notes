[databases]
saga_db = host=postgres port=5432 dbname=saga_db user=postgres password=postgres

[pgbouncer]
listen_addr = *
listen_port = 6436
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres
stats_users = postgres
ignore_startup_parameters = extra_float_digits, application_name
pool_mode = session
max_client_conn = 100
default_pool_size = 20
