server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
- job_name: app_logs
  static_configs:
  - targets:
      - localhost
    labels:
      job: go_microservice
      __path__: /app/logs/*.log
  
  # Parsing JSON secara otomatis agar field-fieldnya bisa di-query di Grafana
  pipeline_stages:
  - json:
      expressions:
        level: level
        msg: msg
        service: service
        trace_id: trace_id
  - labels:
      level:
      service:
