services:
  # ─── DATA & MESSAGING LAYER ───────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: flash_sale_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./init-db/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flash_sale_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: flash_sale_db
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 20
    ports:
      - "6432:6432"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_INTERNAL://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      - zookeeper

  # ─── GATEWAY LAYER ─────────────────────────────────────
  kong:
    image: kong:latest
    container_name: kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./gateway/kong.yml:/usr/local/kong/declarative/kong.yml:ro
    ports:
      - "8000:8000"
      - "8001:8001"

  # ─── APPLICATION LAYER (GO ECHO & RUST AXUM) ───────────
  user_service:
    build:
      context: ./services/user_service
    container_name: user_service
    environment:
      PORT: "8081"
      DB_HOST: pgbouncer
      DB_PORT: "6432"
    ports:
      - "8081:8081"
    depends_on:
      - pgbouncer

  flash_sale_service:
    build:
      context: ./services/flash_sale_service
    container_name: flash_sale_service
    environment:
      PORT: "8082"
      DB_HOST: pgbouncer
      DB_PORT: "6432"
      REDIS_ADDR: redis:6379
      KAFKA_BROKER: kafka:9092
    ports:
      - "8082:8082"
    depends_on:
      - pgbouncer
      - redis
      - kafka

  order_service:
    build:
      context: ./services/order_service
    container_name: order_service
    environment:
      PORT: "8083"
      DB_HOST: pgbouncer
      DB_PORT: "6432"
      KAFKA_BROKER: kafka:9092
    ports:
      - "8083:8083"
    depends_on:
      - pgbouncer
      - kafka

  payment_service:
    build:
      context: ./services/payment_service
    container_name: payment_service
    environment:
      PORT: "8084"
      DB_HOST: pgbouncer
      DB_PORT: "6432"
      REDIS_ADDR: redis:6379
    ports:
      - "8084:8084"
    depends_on:
      - pgbouncer
      - redis

  inventory_service:
    build:
      context: ./services/inventory_service
    container_name: inventory_service
    environment:
      PORT: "8085"
      DB_HOST: pgbouncer
      DB_PORT: "6432"
      REDIS_URL: redis://redis:6379
    ports:
      - "8085:8085"
    depends_on:
      - pgbouncer
      - redis

  notification_service:
    build:
      context: ./services/notification_service
    container_name: notification_service
    environment:
      PORT: "8086"
    ports:
      - "8086:8086"

  # ─── CLIENT LAYER ──────────────────────────────────────
  client_web:
    build:
      context: ./client
    container_name: client_web
    ports:
      - "8080:80"
    depends_on:
      - kong
