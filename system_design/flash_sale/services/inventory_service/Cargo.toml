[package]
name = "inventory_service"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["cors"] }
redis = { version = "0.25", features = ["tokio-comp"] }
tokio-postgres = "0.7"
dotenvy = "0.15"
