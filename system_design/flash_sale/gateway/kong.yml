_format_version: "3.0"
_transform: true

services:
  - name: user-service
    url: http://user_service:8081
    routes:
      - name: user-routes
        paths:
          - /api/v1/users
        strip_path: false

  - name: flash-sale-service
    url: http://flash_sale_service:8082
    routes:
      - name: flash-sale-routes
        paths:
          - /api/v1/flash-sales
        strip_path: false

  - name: order-service
    url: http://order_service:8083
    routes:
      - name: order-routes
        paths:
          - /api/v1/orders
        strip_path: false

  - name: payment-service
    url: http://payment_service:8084
    routes:
      - name: payment-routes
        paths:
          - /api/v1/payments
        strip_path: false

  - name: inventory-service
    url: http://inventory_service:8085
    routes:
      - name: inventory-routes
        paths:
          - /api/v1/inventory
        strip_path: false

  - name: notification-service
    url: http://notification_service:8086
    routes:
      - name: notification-routes
        paths:
          - /api/v1/notifications
        strip_path: false

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-Idempotency-Key
        - X-User-ID
      credentials: true
