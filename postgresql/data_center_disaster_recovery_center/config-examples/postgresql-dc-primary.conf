# ===================================================================
# PostgreSQL Primary Configuration - MAIN DATA CENTER (DC - JAKARTA)
# ===================================================================

# Network & Connectivity
listen_addresses = '*'
port = 5432
max_connections = 200

# Memory Settings
shared_buffers = 4GB
work_mem = 32MB
maintenance_work_mem = 512MB
wal_buffers = 16MB

# Write Ahead Log (WAL) & Replication Settings
wal_level = replica
max_wal_size = 16GB
min_wal_size = 2GB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min

# Archiving WAL to S3 / Central Backup (pgBackRest Example)
archive_mode = on
archive_command = 'pgbackrest --stanza=production archive-push %p'

# Streaming Replication Options
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 4096MB
hot_standby = on
hot_standby_feedback = on

# Replication Synchronous Mode (LAN Local DC)
synchronous_commit = local # Local WAL write to ensure performance to remote DRC
# synchronous_standby_names = 'FIRST 1 (dc-db02)' # Optional for Intra-DC zero data loss

# Logging & Monitoring
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_min_messages = warning
log_min_error_statement = error
log_line_prefix = '%m [%p] %q%u@%d '

# Standby Timeout Settings
replication_timeout = 60s
