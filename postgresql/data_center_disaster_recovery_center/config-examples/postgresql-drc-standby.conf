# ===================================================================
# PostgreSQL Standby Configuration - DISASTER RECOVERY CENTER (DRC - SURABAYA)
# ===================================================================

# Network & Connectivity
listen_addresses = '*'
port = 5432
max_connections = 200

# Memory Settings (Identical to DC Primary for 1:1 Performance parity)
shared_buffers = 4GB
work_mem = 32MB
maintenance_work_mem = 512MB
wal_buffers = 16MB

# Write Ahead Log (WAL) & Replication Settings
wal_level = replica
max_wal_size = 16GB
min_wal_size = 2GB
checkpoint_completion_target = 0.9

# Read-Only Standby Settings
hot_standby = on
hot_standby_feedback = on

# WAL Restore Command (Fallback to fetch missing WALs from S3 if stream lags)
restore_command = 'pgbackrest --stanza=production archive-get %f "%p"'

# Standby Replication Connection String (Points to DC Primary)
primary_conninfo = 'host=192.168.10.11 port=5432 user=replicator password=StrongReplicationPassword sslmode=require'
primary_slot_name = 'drc_standby_slot'
