;; ============================================
;; PgBouncer Configuration - Data Center (DC)
;; Connection pooler for PostgreSQL Primary
;; ============================================
;;
;; Flow: Application → PgBouncer (6432) → PostgreSQL DC (5432)
;;
;; PgBouncer mengelola pool koneksi ke database,
;; mengurangi overhead pembuatan koneksi baru setiap request.
;; ============================================

[databases]
;; Database mapping: nama_lokal = koneksi_ke_postgresql
;; Aplikasi connect ke PgBouncer dengan dbname=appdb,
;; PgBouncer meneruskan ke PostgreSQL DC
appdb = host=pg-dc port=5432 dbname=appdb user=appuser password=apppassword

[pgbouncer]
;; ── Network Settings ──
listen_addr = 0.0.0.0
listen_port = 6432

;; ── Authentication ──
;; trust = tidak perlu password (development/learning only!)
;; Dalam production, gunakan scram-sha-256 atau md5
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt

;; ── Pool Mode ──
;; session:     1 koneksi server per session klien (paling aman, paling boros)
;; transaction: 1 koneksi server per transaksi (rekomendasi, efisien)
;; statement:   1 koneksi server per statement (paling efisien, banyak batasan)
pool_mode = transaction

;; ── Pool Sizing ──
max_client_conn = 200
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

;; ── Timeouts ──
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 15
client_idle_timeout = 0
client_login_timeout = 60
query_timeout = 0
query_wait_timeout = 120

;; ── Logging ──
logfile = /var/log/pgbouncer/pgbouncer.log
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60

;; ── Admin ──
admin_users = appuser
stats_users = appuser

;; ── Process ──
pidfile = /var/run/pgbouncer/pgbouncer.pid

;; ── Compatibility ──
;; ignore_startup_parameters: parameter yang diabaikan dari klien
;; Diperlukan untuk kompatibilitas dengan pgx/lib-pq
ignore_startup_parameters = extra_float_digits,options
