;; ============================================
;; PgBouncer Configuration - Data Recovery Center (DRC)
;; Connection pooler for PostgreSQL Standby/Promoted
;; ============================================
;;
;; Normal: App → PgBouncer DRC → PostgreSQL DRC (Standby, read-only)
;; Failover: App → PgBouncer DRC → PostgreSQL DRC (Promoted to Primary, read-write)
;;
;; Saat failover, PgBouncer DRC tidak perlu dikonfigurasi ulang
;; karena sudah menunjuk ke pg-drc yang akan dipromosikan.
;; ============================================

[databases]
;; Connects to DRC PostgreSQL
;; Dalam mode standby: hanya read-only queries
;; Setelah failover (promoted): read-write queries
appdb = host=pg-drc port=5432 dbname=appdb user=appuser password=apppassword

[pgbouncer]
;; ── Network Settings ──
listen_addr = 0.0.0.0
listen_port = 6432

;; ── Authentication ──
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt

;; ── Pool Mode ──
pool_mode = transaction

;; ── Pool Sizing ──
max_client_conn = 200
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

;; ── Timeouts ──
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 15
client_idle_timeout = 0
client_login_timeout = 60
query_timeout = 0
query_wait_timeout = 120

;; ── Logging ──
logfile = /var/log/pgbouncer/pgbouncer.log
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60

;; ── Admin ──
admin_users = appuser
stats_users = appuser

;; ── Process ──
pidfile = /var/run/pgbouncer/pgbouncer.pid

;; ── Compatibility ──
ignore_startup_parameters = extra_float_digits,options
