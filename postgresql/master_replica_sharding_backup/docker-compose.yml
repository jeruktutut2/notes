services:
  citus-coordinator:
    image: citusdata/citus:12.1
    container_name: citus-coordinator
    hostname: citus-coordinator
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=app_db
      - PGDATA=/var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - coordinator_data:/var/lib/postgresql/data
      - ./config/init-master.sh:/docker-entrypoint-initdb.d/01-init-master.sh
      - ./sql:/sql
    networks:
      - pg-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  citus-worker-1:
    image: citusdata/citus:12.1
    container_name: citus-worker-1
    hostname: citus-worker-1
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=app_db
    ports:
      - "5434:5432"
    volumes:
      - worker1_data:/var/lib/postgresql/data
    networks:
      - pg-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  citus-worker-2:
    image: citusdata/citus:12.1
    container_name: citus-worker-2
    hostname: citus-worker-2
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=app_db
    ports:
      - "5435:5432"
    volumes:
      - worker2_data:/var/lib/postgresql/data
    networks:
      - pg-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  citus-coordinator-replica:
    image: citusdata/citus:12.1
    container_name: citus-coordinator-replica
    hostname: citus-coordinator-replica
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=app_db
    ports:
      - "5433:5432"
    volumes:
      - ./config/init-replica.sh:/init-replica.sh
      - replica_data:/var/lib/postgresql/data
    networks:
      - pg-network
    depends_on:
      citus-coordinator:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/init-replica.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backup-agent:
    image: citusdata/citus:12.1
    container_name: backup-agent
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts
      - ./sql:/sql
    networks:
      - pg-network
    depends_on:
      citus-coordinator:
        condition: service_healthy
    entrypoint: ["tail", "-f", "/dev/null"]

volumes:
  coordinator_data:
  replica_data:
  worker1_data:
  worker2_data:

networks:
  pg-network:
    driver: bridge
