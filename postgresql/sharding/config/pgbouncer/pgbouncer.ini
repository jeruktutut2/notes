[databases]
citus_db = host=coordinator port=5432 dbname=citus_db user=postgres password=postgrespassword
postgres = host=coordinator port=5432 dbname=postgres user=postgres password=postgrespassword

[pgbouncer]
listen_addr = *
listen_port = 6432
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres
stats_users = postgres
pool_mode = session
max_client_conn = 500
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 5
reserve_pool_timeout = 5
ignore_startup_parameters = extra_float_digits, search_path
