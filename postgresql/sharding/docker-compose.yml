services:
  # ==========================================
  # CITUS COORDINATOR NODE
  # Accepts queries, manages metadata & routing
  # ==========================================
  coordinator:
    image: citusdata/citus:12.1
    container_name: citus_coordinator
    hostname: coordinator
    command: -c wal_level=logical -c max_wal_senders=10 -c max_replication_slots=10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      PGPASSWORD: postgrespassword
      POSTGRES_DB: citus_db
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - coordinator_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d citus_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - citus_net

  # ==========================================
  # CITUS WORKER NODES (1 to 5)
  # Hold sharded table data
  # ==========================================
  worker1:
    image: citusdata/citus:12.1
    container_name: citus_worker1
    hostname: worker1
    command: -c wal_level=logical -c max_wal_senders=10 -c max_replication_slots=10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      PGPASSWORD: postgrespassword
      POSTGRES_DB: citus_db
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - worker1_data:/var/lib/postgresql/data
    depends_on:
      coordinator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d citus_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - citus_net

  worker2:
    image: citusdata/citus:12.1
    container_name: citus_worker2
    hostname: worker2
    command: -c wal_level=logical -c max_wal_senders=10 -c max_replication_slots=10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      PGPASSWORD: postgrespassword
      POSTGRES_DB: citus_db
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - worker2_data:/var/lib/postgresql/data
    depends_on:
      coordinator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d citus_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - citus_net

  worker3:
    image: citusdata/citus:12.1
    container_name: citus_worker3
    hostname: worker3
    command: -c wal_level=logical -c max_wal_senders=10 -c max_replication_slots=10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      PGPASSWORD: postgrespassword
      POSTGRES_DB: citus_db
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - worker3_data:/var/lib/postgresql/data
    depends_on:
      coordinator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d citus_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - citus_net

  worker4:
    image: citusdata/citus:12.1
    container_name: citus_worker4
    hostname: worker4
    command: -c wal_level=logical -c max_wal_senders=10 -c max_replication_slots=10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      PGPASSWORD: postgrespassword
      POSTGRES_DB: citus_db
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - worker4_data:/var/lib/postgresql/data
    depends_on:
      coordinator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d citus_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
