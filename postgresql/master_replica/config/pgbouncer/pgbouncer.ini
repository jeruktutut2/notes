[databases]
db_write = host=haproxy port=5000 dbname=appdb user=appuser password=apppassword
db_read = host=haproxy port=5001 dbname=appdb user=appuser password=apppassword

[pgbouncer]
listen_addr = *
listen_port = 6432
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres, appuser
stats_users = postgres, appuser
pool_mode = transaction
max_client_conn = 100
default_pool_size = 20
reserve_pool_size = 5
ignore_startup_parameters = extra_float_digits
