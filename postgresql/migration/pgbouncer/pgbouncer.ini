[databases]
migration_db = host=postgres port=5432 dbname=migration_db

[pgbouncer]
; ==========================================
; KONFIGURASI PGBOUNCER
; ==========================================

; Alamat yang didengarkan (0.0.0.0 = semua interface)
listen_addr = 0.0.0.0

; Port yang didengarkan (standar PgBouncer: 6432)
listen_port = 6432

; ==========================================
; AUTENTIKASI
; ==========================================

; Tipe autentikasi: md5, scram-sha-256, trust, dll
auth_type = md5

; File yang berisi daftar user dan password
auth_file = /etc/pgbouncer/userlist.txt

; ==========================================
; POOL MODE
; ==========================================
; Ada 3 mode:
;
; 1. session   - Koneksi dipegang selama session client aktif
;                Paling aman tapi paling boros koneksi
;
; 2. transaction - Koneksi dikembalikan ke pool setelah transaksi selesai
;                  REKOMENDASI untuk web app (balance performa & keamanan)
;                  CATATAN: prepared statements & advisory locks tidak didukung!
;
; 3. statement  - Koneksi dikembalikan setelah setiap statement
;                 Paling efisien tapi paling restrictive
;                 Tidak support multi-statement transactions

pool_mode = transaction

; ==========================================
; LIMIT KONEKSI
; ==========================================

; Maksimum koneksi dari client ke PgBouncer
max_client_conn = 200

; Jumlah koneksi default ke PostgreSQL per database/user
default_pool_size = 20

; Koneksi minimum yang selalu dijaga ke PostgreSQL
min_pool_size = 5

; Koneksi cadangan yang bisa dibuat saat pool penuh
reserve_pool_size = 5

; Timeout (detik) sebelum menggunakan reserve pool
reserve_pool_timeout = 3

; ==========================================
; TIMEOUT
; ==========================================

; Timeout koneksi ke server PostgreSQL (detik)
server_connect_timeout = 15

; Timeout login client (detik)
server_login_retry = 3

; Waktu maksimum query berjalan (detik, 0 = unlimited)
query_timeout = 120

; Waktu idle sebelum koneksi server ditutup (detik)
server_idle_timeout = 300

; ==========================================
; LOGGING
; ==========================================

; Log level: debug, info, notice, warning, error
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

; Stats periodik (detik)
stats_period = 60

; ==========================================
; ADMIN
; ==========================================

; Admin database untuk monitoring
admin_users = postgres

; Akses ke database pgbouncer untuk monitoring
; Gunakan: psql -p 6432 -U postgres pgbouncer -c "SHOW POOLS"
